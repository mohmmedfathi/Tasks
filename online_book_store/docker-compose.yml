services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: book_store
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn --chdir src config.wsgi --bind 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "True"
      POSTGRES_SERVICE: db:5432
    ports:
      - "8000:8000"
    depends_on:
      - db
    # the db may not accept connections yet on the first boot so migrate just retries
    restart: on-failure

volumes:
  postgres_data:
